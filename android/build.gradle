// Top-level Gradle file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Usually empty if using the new pluginManagement in settings.gradle.
        // Make sure you have no old classpath lines for Kotlin or AGP here.
    }
}

plugins {
    // Typically empty or for extra tasks in modern Flutter setups.
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
