plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Flutter Gradle plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Google Services plugin (for Firebase, etc.)
    id "com.google.gms.google-services"
}

android {
    namespace "app.hudhuds.quran"
    compileSdkVersion 35
    ndkVersion = flutter.ndkVersion
    buildToolsVersion "35.0.0"

    aaptOptions {
        noCompress "tflite"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "app.hudhuds.quran"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 5
        versionName "1.0"
        manifestPlaceholders["AD_ID_PERMISSION"] = false
    }

    // (NEW) Here we define signing configs for debug & release.
    signingConfigs {
        debug {
            // Default debug config (auto-generated by Android Studio)
        }
        release {
            // Update these values with your actual keystore info:
            storeFile file("C:/Users/yaman/Downloads/hudhud_quran_app_new/android/app/my-release-key.jks")
            storePassword "HudhudQuran765!"
            keyAlias "myKeyAlias"
            keyPassword "HudhudQuran765!"
        }
    }

    buildTypes {
        release {
            // Use your custom release signing config
            signingConfig signingConfigs.release
            // (Optional) Additional release configs:
            // minifyEnabled false
            // shrinkResources false
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Use debug signing config
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    // Firebase BoM (Bill of Materials) to align versions
    implementation platform('com.google.firebase:firebase-bom:32.2.3')

    // Example: Firebase Analytics
    implementation 'com.google.firebase:firebase-analytics'
    // Add other Firebase libraries here as needed...

    implementation 'com.android.billingclient:billing:7.1.1' // or higher
    
}

flutter {
    source "../.."
}
